<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>9月11—17日配图预览</title><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#292c30;font:16px/1.6 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:28px 24px 60px}h1{font-size:28px;margin:0 0 8px}h2{font-size:22px;margin:0}p{margin:8px 0 18px;color:#5a5d60}nav,.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.toolbar{position:sticky;top:0;padding:12px 0;background:#f5f2ebee;z-index:1;align-items:center}a,button{font:inherit;color:#284879}nav a,button{border:1px solid #b8bcc1;border-radius:7px;padding:7px 13px;background:#fff;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#284879;color:white;border-color:#284879}section{padding-top:35px;scroll-margin-top:80px}.links{font-size:14px;display:flex;gap:18px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:16px}figure{margin:0}img{display:block;width:100%;height:auto;aspect-ratio:3/4;object-fit:contain;background:#e8e4da}figcaption{font-size:14px;margin-top:6px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){main{padding:20px 16px 48px}.grid{grid-template-columns:1fr;gap:22px}h1{font-size:24px}}</style></head><body><main><h1>9月11—17日配图预览</h1><p>每篇五页，点击图片查看原图。</p><nav aria-label="按日期查看"><a href="#d20260911">9月11日</a><a href="#d20260912">9月12日</a><a href="#d20260913">9月13日</a><a href="#d20260914">9月14日</a><a href="#d20260915">9月15日</a><a href="#d20260916">9月16日</a><a href="#d20260917">9月17日</a></nav><div class="toolbar"><button type="button" data-filter="all" aria-pressed="true">全部7篇</button><button type="button" data-filter="handwritten" aria-pressed="false">手写实验3篇</button><button type="button" data-mode="new" aria-pressed="true">手写版</button><button type="button" data-mode="old" aria-pressed="false">改版前</button><span id="version" aria-live="polite">当前：手写版</span></div><div id="posts"></div>
<script>
function contentRoot(day){return ['20260911','20260912'].includes(day)?'../../02_已发布/':'../../01_内容生产/';}
const posts=[['20260911','give up / give in','give_up_%E8%BF%98%E6%98%AF_give_in'],['20260912','ask for / ask about','ask_for_%E8%BF%98%E6%98%AF_ask_about'],['20260913','clean up / tidy up','clean_up_%E8%BF%98%E6%98%AF_tidy_up'],['20260914','go away / get away','go_away_%E8%BF%98%E6%98%AF_get_away'],['20260915','go to bed / fall asleep','go_to_bed_%E8%BF%98%E6%98%AF_fall_asleep'],['20260916','put back / put away','put_back_%E8%BF%98%E6%98%AF_put_away'],['20260917','lock up / lock someone out','lock_up_%E8%BF%98%E6%98%AF_lock_someone_out']];const labels=['封面','图2_场景对比','图3_一句话规则','图4_自测','图5_答案复习'];function file(day,base,label){return contentRoot(day)+day+'/'+day+'_001_'+base+'_'+encodeURIComponent(label)+'.png'}posts.forEach(([day,title,base])=>{const root=contentRoot(day);const s=document.createElement('section');s.id='d'+day;s.dataset.handwritten=['20260913','20260914','20260915'].includes(day);s.innerHTML='<h2>'+day.slice(4,6)+'月'+day.slice(6)+'日 · '+title+'</h2><div class="links"><a href="'+root+day+'/'+day+'_001_'+base+'_图片提示词.md">提示词与验收</a><a href="'+root+day+'/'+day+'_001_'+base+'_发布内容.md">发布文案</a></div><div class="grid">'+labels.map(label=>{const n=file(day,base,label);let old=n;if(s.dataset.handwritten==='true')old=root+day+'/'+day+'_制作素材/20260912手写改版前/'+day+'_001_'+base+'_'+encodeURIComponent(label)+'.png';return '<figure><a class="image-link" href="'+n+'"><img loading="lazy" src="'+n+'" data-new="'+n+'" data-old="'+old+'" alt="'+day+' '+label+'"></a><figcaption>'+label+'</figcaption></figure>'}).join('')+'</div>';document.getElementById('posts').append(s)});let mode='new',filter='all';function update(){document.querySelectorAll('section').forEach(s=>s.hidden=filter==='handwritten'&&s.dataset.handwritten!=='true');document.querySelectorAll('img[data-new]').forEach(img=>{const n=img.dataset[mode];img.src=n;img.closest('a').href=n});document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));document.getElementById('version').textContent=mode==='new'?'当前：手写版':'当前：改版前'}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;update()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;update()});function openHash(hash=location.hash){
  if(hash==='#handwritten'){filter='handwritten';update();return;}
  if(!/^#d202609(11|12|13|14|15|16|17)$/.test(hash))return;
  const section=document.getElementById(hash.slice(1));
  if(!section)return;
  if(section.hidden){filter='all';update();}
  requestAnimationFrame(()=>section.scrollIntoView({block:'start'}));
}
window.addEventListener('hashchange',()=>openHash());
document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',()=>openHash(a.getAttribute('href'))));
update();openHash();
</script></main></body></html>
